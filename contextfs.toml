# ============================================================================
# ContextFS configuration
# ============================================================================
# Every path in this file is resolved RELATIVE TO THIS FILE unless it is
# already absolute. Nothing in the codebase may hardcode a scan path; this
# file (or a CLI flag, or CONTEXTFS_* environment variables) is the only way
# a root directory is chosen.
#
# Precedence (highest wins):
#   1. CLI flag           (e.g. --root D:\SomeFolder)
#   2. Environment var    (e.g. CONTEXTFS_ROOT)
#   3. This config file
#   4. Built-in defaults
#
# To point ContextFS at your own files without touching version control,
# copy this to `contextfs.local.toml` (git-ignored) and edit that instead.
# ============================================================================

[general]
# Human-readable name for this index. Used in CLI output and stats.
profile_name = "default"

[paths]
# The directory tree ContextFS will scan. READ-ONLY: ContextFS never writes,
# renames, moves or deletes anything under this path.
# Default points at the generated synthetic corpus (Phase 3), so a fresh
# clone is runnable with zero configuration.
root = "data/synthetic/corpus"

# Where ALL derived data lives. Nothing is ever written outside this dir.
data_dir = ".contextfs"

# Sub-stores inside data_dir (relative to data_dir unless absolute).
sqlite_path = "contextfs.db"      # metadata, entities, sessions, feedback
vector_path = "vectors.lance"     # LanceDB embedding store
graph_path = "graph.json"         # serialised NetworkX MultiDiGraph

[scan]
# Directory names skipped entirely during traversal.
ignore_dirs = [
    ".git", ".svn", ".hg",
    "node_modules", "__pycache__", ".venv", "venv", "env",
    ".contextfs", ".pytest_cache", ".ruff_cache", ".mypy_cache",
    "build", "dist", ".eggs", "site-packages",
    "$RECYCLE.BIN", "System Volume Information",
    "AppData", "Windows", "Program Files", "Program Files (x86)",
]

# Glob patterns for files to skip.
ignore_globs = [
    "*.tmp", "*.temp", "~$*", ".~lock.*",
    "*.exe", "*.dll", "*.so", "*.dylib", "*.bin",
    "*.zip", "*.7z", "*.rar", "*.iso",
    "Thumbs.db", "desktop.ini", ".DS_Store",
]

# Extensions ContextFS will attempt to extract content from.
# Anything else is still recorded as a file node (metadata only).
include_extensions = [
    ".pdf", ".docx", ".pptx", ".xlsx", ".txt", ".md", ".markdown",
    ".py", ".js", ".ts", ".java", ".c", ".cpp", ".h", ".cs", ".go",
    ".rs", ".rb", ".sh", ".sql", ".html", ".css", ".json", ".yaml", ".yml",
    ".csv",
]

# Files larger than this are recorded but not content-extracted.
max_file_size_mb = 50

# Follow symbolic links / junctions. Off by default: prevents cycles and
# accidental traversal outside the configured root.
follow_symlinks = false

[extraction]
# Hard cap on characters pulled from a single document, to bound memory on
# low-RAM machines. Set to 0 for unlimited.
max_chars_per_document = 400000

[entities]
# spaCy model. en_core_web_md is the default because it was MEASURED to be
# substantially better on this corpus, not because it is bigger:
#
#   model            entity F1   recall   location F1   time/40 docs   on disk
#   en_core_web_sm     0.472     0.586      0.333         2337 ms      14.5 MB
#   en_core_web_md     0.595     0.759      0.857         2794 ms      53.9 MB
#
# The md model carries word vectors, which is what lets it recognise rare
# proper nouns (company names, Indian place names) that the sm model misses
# entirely. 20% slower on a cost paid only for files that changed.
# Switch to en_core_web_sm if disk or install size matters more than accuracy.
spacy_model = "en_core_web_md"

# Maximum keywords kept per document.
max_keywords = 25

# Suppress short ALL-CAPS tokens typed as organisations (API, SQL, DBMS, FYP).
# On technical personal corpora these are overwhelmingly domain acronyms, not
# organisations, and they dominated organisation false positives in the Phase 6
# evaluation. TRADE-OFF: this also discards genuine short acronym organisations
# such as IBM or NASA. Turn it off for a corpus where those matter.
drop_acronym_orgs = true

# Propagate entities confidently detected in prose to documents where the
# statistical model has too little context to find them (headings, spreadsheet
# cells, bullet lists). Only terms containing a lowercase letter propagate.
gazetteer_propagation = true
gazetteer_min_length = 4

[embeddings]
# sentence-transformers model. all-MiniLM-L6-v2 is 384-dim, ~90 MB, and
# CPU-fast - chosen deliberately for the target hardware (see log.md).
model = "sentence-transformers/all-MiniLM-L6-v2"
dimension = 384
# Chunking (justified in docs/ - Phase 7).
chunk_size_tokens = 256
chunk_overlap_tokens = 48
batch_size = 16
# Force CPU inference. The target machine has no CUDA device.
device = "cpu"

# Encoder backend. Both produce identical vectors (verified by test to 1e-5).
#   "transformers"          - default. Same weights, same mean-pooling, but
#                             avoids sentence-transformers' ~11.6 s package
#                             import on every indexing run (measured).
#   "sentence-transformers" - the reference implementation, kept as the oracle.
backend = "transformers"

# PyTorch intra-op threads. 0 = every logical processor.
# PyTorch defaults to physical cores only (4 of 8 here); using all 8 measured
# 19.5 -> 34.5 chunks/s on this CPU.
num_threads = 0

[summarization]
# Optional local LLM for semantic-tree summaries. ContextFS MUST remain
# fully functional with this disabled; an extractive fallback is used.
enabled = false
backend = "ollama"                # only local backends are permitted
model = "llama3.2:3b"
endpoint = "http://127.0.0.1:11434"
timeout_seconds = 120

[graph]
# Cosine similarity above which two documents get a `semantic` edge.
semantic_edge_threshold = 0.55
# Max semantic edges kept per node (keeps the graph sparse and fast).
semantic_edges_per_node = 8
# Minimum shared named entities for an `entity` edge.
min_shared_entities = 2

# --- Near-duplicate detection --------------------------------------------
# Duplicates are decided by JACCARD over 5-word shingles, not by embedding
# cosine. Measured on this corpus:
#
#   pair                       cosine    jaccard
#   planted duplicate #1        0.928     0.519
#   planted duplicate #2        0.827     0.393
#   best NON-duplicate pair     0.807     0.021
#
# Cosine leaves a 0.019 margin - unusable. Jaccard leaves 0.372. Embeddings
# are trained to put same-topic documents close together, which is precisely
# the wrong signal here: two different essays about BCNF should be
# semantically close and are not duplicates.
duplicate_threshold = 0.25

# Cosine acts only as a cheap candidate filter before the shingle comparison,
# so we never build shingle sets for all O(n^2) pairs.
duplicate_candidate_similarity = 0.70

[temporal]
# --- Meaningful vs. incidental date classification (Phase 10) --------------
# Signal weights. Must sum to 1.0; validated at load time.
weight_keyword_proximity = 0.40
weight_structured_context = 0.25
weight_metadata_consistency = 0.20
weight_cross_file_recurrence = 0.15

# A date becomes a timeline node only at or above this relevance score.
# This is the single most important tunable parameter in the system.
timeline_node_threshold = 0.55

# Token window around a date mention searched for meaningful-date keywords.
keyword_window_tokens = 12

# Days between a mentioned date and the document's mtime within which the
# metadata-consistency signal is considered fully satisfied. The signal is
# asymmetric: dates BEFORE the document's mtime decay twice as fast, because
# people write about deadlines before they fall due.
metadata_consistency_window_days = 60

# A mention carrying only year precision ("published in 1998") is multiplied
# by this. A bare year cannot be an actionable date - you cannot attend an
# exam "in 1998". Applied after the weighted sum and reported separately,
# because it is a statement about the KIND of mention, not graded evidence.
year_only_penalty = 0.35

# Number of distinct files at which the cross-file recurrence signal saturates.
# The difference between 1 file and 3 is informative; 10 versus 12 is not.
recurrence_saturation = 4

[activity]
# --- Activity session reconstruction (Phase 12) ---------------------------
# Maximum IDLE GAP inside a session, in hours. Two stretches of work merge only
# if some file of one was edited within this long of some file of the other.
# It does NOT cap a session's total duration - real sessions run for weeks.
#
# Chosen from the measured gap distribution of the corpus's planted sessions:
#
#   session                files  span   largest gap between consecutive files
#   hackathon_urbanflow        8    1 d    24 h
#   dbms_assignment            5   11 d   100 h
#   ml_exam_prep               7   12 d   131 h
#   internship_apps            5   15 d   190 h
#   capstone_contextfs         7   25 d   219 h
#   personal_misc (CONTROL)    5  223 d  2598 h, smallest internal gap 192 h
#
# 240 h (10 days) admits every real session with margin above the largest
# (219 h). The negative control has a 192 h internal gap that also passes the
# gate - deliberately: it is then rejected by the affinity threshold below,
# which is the correct division of labour. Time decides what *could* be one
# session; content decides what *is*.
session_gap_hours = 240
# Minimum average affinity (temporal + semantic + entity + folder) for two
# clusters to merge. Time decides what COULD be one session; this decides what is.
#
# Measured sweep against ground truth (precision / recall / pairwise F1,
# sessions recovered out of 5, and whether the q01 adversarial case is solved):
#
#   threshold   prec    rec     F1   recovered  q01    over-clustered control
#     0.02     0.841  1.000  0.914      5/5     OK            0
#     0.05     0.900  1.000  0.947      5/5     OK            0
#     0.10     1.000  1.000  1.000      5/5     OK            0
#     0.18     1.000  1.000  1.000      5/5     OK            0   <- configured
#     0.25     1.000  1.000  1.000      5/5     OK            0
#     0.27     1.000  0.822  0.902      5/5    FAIL           0
#     0.35     1.000  0.600  0.750      5/5    FAIL           0
#
# The optimum is a PLATEAU spanning 0.10-0.25, fifteen points wide, so 0.18 sits
# in the middle of a broad region rather than on a knife-edge. Above 0.27 the
# exam-prep session fragments and the adversarial case is lost; below 0.10
# unrelated sessions begin to merge. The negative control is never clustered at
# any threshold tested, including 0.02.
session_link_threshold = 0.18
# Sessions smaller than this are discarded as noise.
min_session_size = 2

[retrieval]
# --- Hybrid ranking weights (Phase 15). Must sum to 1.0. ------------------
weight_semantic = 0.45
weight_graph = 0.20
weight_activity = 0.20
weight_timeline = 0.15
# Feedback nudge (Phase 19) is applied as a bounded multiplier, not a weight.
feedback_max_boost = 0.15

# Graph traversal budget.
max_hops = 2
max_seed_nodes = 10
max_expanded_nodes = 400
top_k = 10

[eval]
# Ground-truth benchmark used by the evaluation harness (Phases 21-22).
ground_truth = "data/synthetic/ground_truth.json"
results_dir = "data/eval"
k_values = [1, 3, 5, 10]
