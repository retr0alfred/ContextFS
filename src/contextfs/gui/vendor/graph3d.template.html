<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ContextFS - relationship graph</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0f1117; color:#e6e9f0; overflow:hidden;
         font-family:"Segoe UI",system-ui,sans-serif; }
  #stage { position:fixed; inset:0; display:block; }
  .panel { position:fixed; background:rgba(23,26,35,.92); border:1px solid #2a3040;
           border-radius:10px; padding:14px 16px; }
  #controls { top:16px; left:16px; width:236px; }
  #controls h1 { margin:0 0 2px 0; font-size:15px; }
  #controls .sub { color:#8b93a7; font-size:11px; margin-bottom:10px; line-height:1.5; }
  .legend { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:12px;
            cursor:pointer; user-select:none; opacity:.4; transition:opacity .15s; }
  .legend.on { opacity:1; }
  .legend .n { margin-left:auto; color:#8b93a7; font-size:11px; }
  .swatch { width:13px; height:13px; border-radius:3px; flex:0 0 auto; }
  .section { margin-top:12px; padding-top:10px; border-top:1px solid #2a3040;
             color:#8b93a7; font-size:11px; text-transform:uppercase;
             letter-spacing:.06em; margin-bottom:4px; }
  #detail { bottom:16px; left:16px; max-width:560px; font-size:12px; display:none;
            line-height:1.6; }
  #detail .name { font-size:14px; font-weight:600; }
  #detail .path { color:#8b93a7; word-break:break-all; }
  #hint { bottom:16px; right:16px; color:#8b93a7; font-size:11px; }
  #count { position:fixed; top:16px; right:16px; color:#8b93a7; font-size:11px;
           text-align:right; line-height:1.7; }
  button { background:#1f2430; color:#e6e9f0; border:1px solid #2a3040;
           border-radius:6px; padding:7px 10px; cursor:pointer; font-size:12px;
           width:100%; margin-top:10px; }
  button:hover { border-color:#5b9cff; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="panel" id="controls">
  <h1>Relationship graph</h1>
  <div class="sub">drag to orbit &middot; scroll to zoom &middot; click a node</div>
  <div class="section">Relations</div>
  <div id="edgeLegend"></div>
  <div class="section">Nodes</div>
  <div id="nodeLegend"></div>
  <button id="freeze">Pause layout</button>
</div>

<div class="panel" id="detail"></div>
<div class="panel" id="hint">rendered locally &middot; three.js is bundled, nothing is fetched</div>
<div id="count"></div>

<script type="module">
/* ---- three.js (bundled, MIT licence, r160) ------------------------------ */
/*__THREE__*/

/* ---- graph data --------------------------------------------------------- */
const DATA = /*__DATA__*/;

/* ---- scene -------------------------------------------------------------- */
const canvas = document.getElementById('stage');
const renderer = new WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new Scene();
scene.background = new Color(0x0f1117);
scene.fog = new FogExp2(0x0f1117, 0.0016);

const camera = new PerspectiveCamera(55, innerWidth / innerHeight, 1, 8000);
camera.position.set(0, 0, 620);

const N = DATA.nodes.length;

/* ---- layout state ------------------------------------------------------- */
/* A force-directed simulation, integrated on the main thread. Repulsion is
   sampled rather than all-pairs: every node is pushed away from a small random
   subset each frame, which is O(n*k) instead of O(n^2) and converges to a
   visually equivalent layout. On integrated graphics that difference is what
   keeps this interactive at ~1200 nodes. */
const pos = new Float32Array(N * 3);
const vel = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  // Seed on a sphere: a random cube start collapses into a cube-shaped blob
  // that takes far longer to relax.
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  const r = 180 + Math.random() * 90;
  pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  pos[i * 3 + 2] = r * Math.cos(phi);
}

const REPULSION = 5200, SPRING = 0.0055, DAMPING = 0.86, CENTRE = 0.0016, SAMPLES = 14;
let frozen = false, alpha = 1.0;

function step() {
  if (frozen) return;
  for (let i = 0; i < N; i++) {
    const ix = i * 3;
    for (let s = 0; s < SAMPLES; s++) {
      const j = (Math.random() * N) | 0;
      if (j === i) continue;
      const jx = j * 3;
      let dx = pos[ix] - pos[jx], dy = pos[ix + 1] - pos[jx + 1], dz = pos[ix + 2] - pos[jx + 2];
      let d2 = dx * dx + dy * dy + dz * dz;
      if (d2 < 1) { d2 = 1; dx = Math.random() - 0.5; dy = Math.random() - 0.5; }
      const f = (REPULSION / d2) * alpha;
      const d = Math.sqrt(d2);
      vel[ix] += (dx / d) * f; vel[ix + 1] += (dy / d) * f; vel[ix + 2] += (dz / d) * f;
    }
    vel[ix] -= pos[ix] * CENTRE;
    vel[ix + 1] -= pos[ix + 1] * CENTRE;
    vel[ix + 2] -= pos[ix + 2] * CENTRE;
  }
  for (const e of DATA.edges) {
    const a = e.s * 3, b = e.t * 3;
    const dx = pos[b] - pos[a], dy = pos[b + 1] - pos[a + 1], dz = pos[b + 2] - pos[a + 2];
    const k = SPRING * (0.35 + e.w) * alpha;
    vel[a] += dx * k; vel[a + 1] += dy * k; vel[a + 2] += dz * k;
    vel[b] -= dx * k; vel[b + 1] -= dy * k; vel[b + 2] -= dz * k;
  }
  for (let i = 0; i < N * 3; i++) {
    vel[i] *= DAMPING;
    pos[i] += vel[i];
  }
  // Cool slowly, then stop integrating entirely: a simulation that never
  // settles burns CPU forever, and on a laptop that is a battery bug.
  alpha *= 0.997;
  if (alpha < 0.02) { alpha = 0.02; }
}

/* ---- nodes -------------------------------------------------------------- */
const nodeGeom = new BufferGeometry();
const nodeCol = new Float32Array(N * 3);
const nodeSize = new Float32Array(N);
const c = new Color();
DATA.nodes.forEach((n, i) => {
  c.set(DATA.nodeColours[n.kind] || '#5b9cff');
  nodeCol[i * 3] = c.r; nodeCol[i * 3 + 1] = c.g; nodeCol[i * 3 + 2] = c.b;
  nodeSize[i] = 5 + Math.min(16, Math.sqrt(n.degree) * 3.2);
});
nodeGeom.setAttribute('position', new BufferAttribute(pos, 3));
nodeGeom.setAttribute('color', new BufferAttribute(nodeCol, 3));
nodeGeom.setAttribute('size', new BufferAttribute(nodeSize, 1));

const nodeMat = new ShaderMaterial({
  transparent: true, depthWrite: false, blending: AdditiveBlending,
  vertexShader: `
    attribute float size; varying vec3 vColor;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (320.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if (d > 0.5) discard;
      float core = smoothstep(0.5, 0.08, d);
      float halo = smoothstep(0.5, 0.0, d) * 0.55;
      gl_FragColor = vec4(vColor, core + halo);
    }`,
  vertexColors: true,
});
scene.add(new Points(nodeGeom, nodeMat));

/* ---- edges, one mesh per relation type so they toggle independently ------ */
const edgeGroups = {};
for (const [type, style] of Object.entries(DATA.edgeStyles)) {
  const subset = DATA.edges.filter((e) => e.type === type);
  if (!subset.length) continue;
  const geom = new BufferGeometry();
  geom.setAttribute('position', new BufferAttribute(new Float32Array(subset.length * 6), 3));
  const mat = new LineBasicMaterial({
    color: new Color(style.colour), transparent: true,
    opacity: type === 'structural' ? 0.16 : 0.34, depthWrite: false,
    blending: AdditiveBlending,
  });
  const mesh = new LineSegments(geom, mat);
  mesh.visible = !!style.on;
  scene.add(mesh);
  edgeGroups[type] = { mesh, subset, geom };
}

function syncEdges() {
  for (const { mesh, subset, geom } of Object.values(edgeGroups)) {
    if (!mesh.visible) continue;
    const arr = geom.attributes.position.array;
    subset.forEach((e, i) => {
      const a = e.s * 3, b = e.t * 3, o = i * 6;
      arr[o] = pos[a]; arr[o + 1] = pos[a + 1]; arr[o + 2] = pos[a + 2];
      arr[o + 3] = pos[b]; arr[o + 4] = pos[b + 1]; arr[o + 5] = pos[b + 2];
    });
    geom.attributes.position.needsUpdate = true;
  }
}

/* ---- orbit control (hand-rolled: OrbitControls is not in the core build) -- */
let dragging = false, lastX = 0, lastY = 0;
let yaw = 0, pitch = 0.25, dist = 620, targetDist = 620;
canvas.addEventListener('pointerdown', (e) => {
  dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointerup', (e) => {
  dragging = false; canvas.releasePointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  yaw -= (e.clientX - lastX) * 0.005;
  pitch = Math.max(-1.5, Math.min(1.5, pitch - (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  targetDist = Math.max(90, Math.min(2600, targetDist * (1 + Math.sign(e.deltaY) * 0.12)));
}, { passive: false });

/* ---- picking ------------------------------------------------------------ */
const raycaster = new Raycaster();
raycaster.params.Points.threshold = 9;
const pointer = new Vector2();
const detail = document.getElementById('detail');

canvas.addEventListener('click', (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObject(scene.children[0]);
  if (!hits.length) { detail.style.display = 'none'; return; }
  const n = DATA.nodes[hits[0].index];
  const colour = DATA.nodeColours[n.kind] || '#5b9cff';
  const neighbours = DATA.edges
    .filter((x) => x.s === hits[0].index || x.t === hits[0].index)
    .reduce((acc, x) => { acc[x.type] = (acc[x.type] || 0) + 1; return acc; }, {});
  const rel = Object.entries(neighbours)
    .map(([t, k]) => `<span style="color:${DATA.edgeStyles[t]?.colour || '#8b93a7'}">${t} ${k}</span>`)
    .join(' &middot; ') || 'no relations';
  detail.innerHTML =
    `<div class="name" style="color:${colour}">${n.short}</div>` +
    `<div class="path">${n.label}</div>` +
    `<div style="margin-top:6px">${n.kind} &middot; degree ${n.degree}</div>` +
    `<div style="margin-top:4px">${rel}</div>`;
  detail.style.display = 'block';
});

/* ---- legend ------------------------------------------------------------- */
function legend(target, entries, onToggle) {
  const host = document.getElementById(target);
  for (const [key, meta] of entries) {
    const row = document.createElement('div');
    row.className = 'legend' + (meta.on ? ' on' : '');
    row.innerHTML =
      `<span class="swatch" style="background:${meta.colour}"></span>` +
      `<span>${key}</span><span class="n">${meta.count}</span>`;
    if (onToggle) {
      row.onclick = () => { row.classList.toggle('on'); onToggle(key, row.classList.contains('on')); };
    } else {
      row.style.cursor = 'default';
    }
    host.appendChild(row);
  }
}

legend(
  'edgeLegend',
  Object.entries(DATA.edgeStyles)
    .filter(([t]) => edgeGroups[t])
    .map(([t, s]) => [t, { colour: s.colour, on: s.on, count: edgeGroups[t].subset.length }]),
  (type, on) => { edgeGroups[type].mesh.visible = on; }
);

const kindCounts = {};
for (const n of DATA.nodes) kindCounts[n.kind] = (kindCounts[n.kind] || 0) + 1;
legend(
  'nodeLegend',
  Object.entries(kindCounts).map(([k, count]) => [k, { colour: DATA.nodeColours[k], on: true, count }])
);

document.getElementById('count').innerHTML =
  `${N} nodes &middot; ${DATA.edges.length} edges` +
  (DATA.dropped ? `<br><span style="color:#fbbf24">${DATA.dropped} lower-degree nodes not shown</span>` : '');

const freeze = document.getElementById('freeze');
freeze.onclick = () => {
  frozen = !frozen;
  freeze.textContent = frozen ? 'Resume layout' : 'Pause layout';
};

/* ---- loop --------------------------------------------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* Frame instrumentation. Exposed on `window` so performance can be measured
   rather than asserted: open the console and read `__contextfs.fps`. Kept in
   the shipped page deliberately - a claim about how fast this renders should
   be checkable by whoever is reading the claim. */
const stats = { fps: 0, frames: 0, stepMs: 0, nodes: N, edges: DATA.edges.length };
window.__contextfs = stats;
let fpsWindowStart = performance.now(), fpsFrames = 0;

function frame() {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  step();
  stats.stepMs = stats.stepMs * 0.9 + (performance.now() - t0) * 0.1;
  stats.frames++;
  if (++fpsFrames >= 30) {
    const now = performance.now();
    stats.fps = Math.round((fpsFrames * 1000) / (now - fpsWindowStart));
    fpsWindowStart = now;
    fpsFrames = 0;
  }
  nodeGeom.attributes.position.needsUpdate = true;
  syncEdges();
  if (!dragging) yaw += 0.0009;            // slow idle drift; stops while you drag
  dist += (targetDist - dist) * 0.1;
  camera.position.set(
    dist * Math.cos(pitch) * Math.sin(yaw),
    dist * Math.sin(pitch),
    dist * Math.cos(pitch) * Math.cos(yaw)
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
frame();
</script>
</body>
</html>
